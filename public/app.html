<title>Union Poker Mini App</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=Manrope:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="union-poker-ui.css">
<script src="https://cdn.jsdelivr.net/npm/@twa-dev/sdk@7.10.1/dist/twa-dev-sdk.min.js" defer></script>
<style>
  html,body{background:var(--up-bg);margin:0;}
  .up-logo{background-image:url(logo.png);}
  body{font-family:var(--up-font-ui);color:var(--up-ink);}
  .screen{display:none;}
  .screen--on{display:block;}
  .app{max-width:560px;margin:0 auto;padding:0 14px calc(92px + env(safe-area-inset-bottom,0px));}
  .up-tabbar{cursor:default;}
  .up-tab{cursor:pointer;font:700 11px var(--up-font-ui);flex-direction:column;gap:2px;color:#8F8266;}
  .up-tab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .up-tab--active{flex-direction:row;gap:7px;font-size:13px;font-weight:800;}
  .up-tab--active svg{width:18px;height:18px;}
  .hero{padding:6px;border-radius:var(--up-r-xl);}
  .hero .up-poster{aspect-ratio:1/.78;border-radius:22px;}
  .hero__bar{display:flex;align-items:center;gap:12px;padding:12px 8px 4px;}
  .hero__bar .txt{flex:1;min-width:0;}
  .hero__bar b{display:block;font-size:14px;font-weight:800;}
  .bar{height:5px;border-radius:3px;background:var(--up-line);margin-top:7px;overflow:hidden;}
  .bar i{display:block;height:100%;background:var(--up-gold);border-radius:3px;}
  .rank{display:flex;align-items:center;gap:12px;background:var(--up-surface);border:1.5px solid var(--up-line);border-radius:var(--up-r-md);padding:9px 13px;margin-bottom:7px;}
  .rank--me{border-color:rgba(212,175,90,.6);background:#231F12;}
  .rank .no{width:22px;text-align:center;font:400 20px var(--up-font-display);color:var(--up-muted);}
  .rank .nm{flex:1;min-width:0;font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rank .nm small{display:block;color:var(--up-muted);font-size:12px;font-weight:600;}
  .rank .pt{font:400 20px var(--up-font-display);color:var(--up-gold-text);}
  .idcard{position:relative;overflow:hidden;border-radius:var(--up-r-xl);padding:16px;color:#fff;height:186px;
    background:radial-gradient(120% 90% at 100% 0%,rgba(212,175,90,.28) 0%,transparent 60%),linear-gradient(160deg,#1E180B,#0A0907 65%);
    border:1px solid rgba(212,175,90,.5);}
  .idcard .wm2{position:absolute;right:-24px;top:-22px;font:400 170px/1 "Segoe UI Symbol","Apple Symbols",serif;color:var(--up-gold-2);opacity:.13;}
  .idcard .top{display:flex;justify-content:space-between;font:400 11px var(--up-font-display);letter-spacing:.24em;color:var(--up-gold-text);position:relative;}
  .idcard .who{display:flex;align-items:center;gap:12px;margin-top:14px;position:relative;}
  .idcard .who b{display:block;font:400 19px var(--up-font-display);}
  .idcard .who small{color:var(--up-gold-dim);font-weight:700;font-size:12px;}
  .idcard .st{position:absolute;left:16px;right:16px;bottom:14px;display:grid;grid-template-columns:repeat(4,auto);justify-content:space-between;}
  .idcard .st b{display:block;font:400 20px var(--up-font-display);color:var(--up-gold-text);}
  .idcard .st small{color:var(--up-muted);font-size:11px;font-weight:700;}
</style>

<div class="app">
  <div class="up-header">
    <div class="up-logo" id="logo"></div>
    <div class="up-wordmark"><b>UNION</b><small>POKER</small></div>
    <div class="up-avatar" id="me" style="margin-left:auto">—</div>
  </div>

  <!-- ГЛАВНАЯ -->
  <section class="screen screen--on" id="sc-home">
    <div class="up-card hero" id="heroCard"></div>
    <div class="up-section"><b>Мои показатели</b><a href="#profile" data-go="profile">Профиль</a></div>
    <div class="up-grid-3" id="myStats"></div>
    <div class="up-section"><b>Скоро в клубе</b><a href="#afisha" data-go="afisha">Вся афиша</a></div>
    <div id="homeList"></div>
  </section>

  <!-- АФИША -->
  <section class="screen" id="sc-afisha">
    <div class="up-section"><b>Афиша</b></div>
    <div id="afishaList" class="up-stack"></div>
  </section>

  <!-- РЕЙТИНГ -->
  <section class="screen" id="sc-rating">
    <div class="up-section"><b>Рейтинг сезона</b><span class="up-chip">2026</span></div>
    <div id="ratingList"></div>
  </section>

  <!-- ПРОФИЛЬ -->
  <section class="screen" id="sc-profile">
    <div class="up-section"><b>Профиль</b></div>
    <div class="idcard" id="idcard"></div>
    <div class="up-section"><b>История турниров</b></div>
    <div id="history"></div>
  </section>
</div>

<nav class="up-tabbar" id="tabs">
  <span class="up-tab up-tab--active" data-go="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Главная</span></span>
  <span class="up-tab" data-go="afisha"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Афиша</span></span>
  <span class="up-tab" data-go="rating"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6"/></svg><span>Рейтинг</span></span>
  <span class="up-tab" data-go="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><span>Профиль</span></span>
</nav>

<div class="up-toast" id="toast"></div>

<script>
/* ============================================================
   ДАННЫЕ
   Пока данные лежат прямо здесь — это заглушка, чтобы видеть экраны.
   Когда появится сервер, замените loadData() на запрос к нему:
     const r = await fetch(API + '/me', {headers:{'X-Init-Data': tg.initData}});
     return await r.json();
   Формат ответа должен совпадать с объектом MOCK ниже.
   ============================================================ */
/* Обычно приложение открыто с самого сервера, поэтому адрес относительный.
   Если файл открыли двойным щелчком (file://) — стучимся на localhost. */
const API = (location.protocol === 'file:') ? 'http://localhost:8080/api' : '/api';
/* dev_id — только для проверки в обычном браузере: ?dev_id=<telegram id>.
   В Telegram он не нужен, там работает подпись initData. */
const DEV = new URLSearchParams(location.search).get('dev_id');
const withDev = p => DEV ? p + (p.includes('?') ? '&' : '?') + 'dev_id=' + DEV : p;
let DEMO = false;         // true — показываем пример вместо настоящих данных
let DEMO_REASON = '';     // и объясняем, почему

const MOCK = {
  me: { name: 'Алексей Иванов', username: 'alex_poker', number: 38, since: 2026,
        tournaments: 27, best: 2, finals: 6, points: 1190, rank: 7 },
  tournaments: [
    { id: 1, title: 'Воскресный турнир', date: '27 сентября', weekday: 'вс', time: '18:00',
      buyin: 2000, seats: 36, taken: 14, theme: '', tag: '27 сен · 18:00',
      meta: "Hold'em · стек 25 000 · вход 2000 ₽", registered: false },
    { id: 2, title: 'Новичковый вечер', date: '1 октября', weekday: 'ср', time: '19:00',
      buyin: 2000, seats: 27, taken: 9, theme: 'up-poster--wine', tag: '1 окт · 19:00',
      meta: 'Для тех, кто играет впервые', registered: false },
    { id: 3, title: 'Deepstack', date: '4 октября', weekday: 'сб', time: '18:00',
      buyin: 3000, seats: 36, taken: 21, theme: 'up-poster--green', tag: '4 окт · 18:00',
      meta: 'Стек 50 000 · уровни 25 минут', registered: true }
  ],
  rating: [
    { place: 1, name: 'Максим Королёв', games: 19, points: 1820 },
    { place: 2, name: 'Дмитрий Соколов', games: 21, points: 1640 },
    { place: 3, name: 'Иван Попов', games: 18, points: 1510 },
    { place: 4, name: 'Анна Воронова', games: 19, points: 1390 },
    { place: 5, name: 'Егор Тимофеев', games: 22, points: 1275 },
    { place: 6, name: 'Роман Лебедев', games: 17, points: 1240 },
    { place: 7, name: 'Алексей Иванов', games: 27, points: 1190, me: true },
    { place: 8, name: 'Кирилл Николаев', games: 15, points: 1105 }
  ],
  history: [
    { date: '20 сентября', title: 'Воскресный турнир', place: 4, of: 32, points: 61 },
    { date: '13 сентября', title: 'Воскресный турнир', place: 11, of: 28, points: 15 },
    { date: '6 сентября', title: 'Новичковый вечер', place: 2, of: 18, points: 85 }
  ]
};

async function loadData(){
  try{
    const r = await fetch(withDev(API + '/app-data'), { headers: { 'X-Init-Data': (tg && tg.initData) || '' } });
    if(r.ok) return await r.json();
    if(r.status === 401){
      DEMO_REASON = DEV ? 'сервер не знает этот dev_id' : 'откройте из бота или добавьте ?dev_id=';
    } else {
      DEMO_REASON = 'сервер ответил ошибкой ' + r.status;
    }
  }catch(e){
    DEMO_REASON = 'нет связи с сервером (' + API + ')';
    console.error('Union Poker:', e);
  }
  DEMO = true;
  return MOCK;
}

/* отправка действия на сервер */
async function apiPost(path, body){
  const r = await fetch(withDev(API + path), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Init-Data': (tg && tg.initData) || '' },
    body: JSON.stringify(body || {})
  });
  return await r.json();
}

/* ---------- Telegram ---------- */
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }

function initials(name){
  return name.split(/\s+/).filter(Boolean).slice(0,2).map(w => w[0].toUpperCase()).join('');
}
function haptic(type){ try{ tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(type); }catch(e){} }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('up-toast--on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('up-toast--on'), 1800);
}
function esc(s){ return String(s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }
function fmt(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }

/* ---------- отрисовка ---------- */
let DATA = null;

function poster(t, cls){
  return '<div class="up-poster ' + (t.theme || '') + ' ' + (cls || '') + '">' +
    '<div class="up-poster__tag">' + esc(t.tag) + '</div>' +
    '<div class="up-poster__logo">UNION POKER</div>' +
    '<div class="up-poster__title">' + esc(t.title) + '</div>' +
    '<div class="up-poster__meta">' + esc(t.meta) + '</div>' +
  '</div>';
}

function renderHome(){
  const t = DATA.tournaments[0];
  const left = t.seats - t.taken;
  document.getElementById('heroCard').innerHTML =
    poster(t) +
    '<div class="hero__bar"><div class="txt"><b>' + t.taken + ' из ' + t.seats + ' мест занято</b>' +
    '<div class="bar"><i style="width:' + Math.round(t.taken / t.seats * 100) + '%"></i></div></div>' +
    '<button class="up-btn ' + (t.registered ? 'up-btn--soft' : 'up-btn--gold') + ' up-btn--sm" data-reg="' + t.id + '">' +
    (t.registered ? 'Вы записаны' : 'Записаться') + '</button></div>';

  document.getElementById('myStats').innerHTML =
    '<div class="up-tile"><b>' + DATA.me.tournaments + '</b><small>ТУРНИРОВ</small></div>' +
    '<div class="up-tile"><b>#' + DATA.me.rank + '</b><small>В РЕЙТИНГЕ</small></div>' +
    '<div class="up-tile"><b>' + DATA.me.finals + '</b><small>ФИНАЛОВ</small></div>';

  document.getElementById('homeList').innerHTML = DATA.tournaments.slice(1).map(x =>
    '<div class="up-row"><div class="up-avatar" style="background:var(--up-info-bg);color:var(--up-gold-text)">' +
      x.date.split(' ')[0] + '</div>' +
    '<div class="up-row__body"><div class="up-row__title">' + esc(x.title) + '</div>' +
    '<div class="up-row__sub">' + esc(x.weekday + ', ' + x.time + ' · вход ' + fmt(x.buyin) + ' ₽') + '</div></div>' +
    (x.registered ? '<span class="up-chip up-chip--ok">записан</span>'
                  : '<span class="up-chip">' + (x.seats - x.taken) + ' мест</span>') + '</div>'
  ).join('');
}

function renderAfisha(){
  document.getElementById('afishaList').innerHTML = DATA.tournaments.map(t =>
    '<div class="up-card" style="padding:6px">' + poster(t) +
    '<div class="hero__bar"><div class="txt"><b>' + esc(t.weekday + ', ' + t.date + ' · ' + t.time) + '</b>' +
    '<div class="up-row__sub">' + (t.seats - t.taken) + ' мест свободно · вход ' + fmt(t.buyin) + ' ₽</div></div>' +
    '<button class="up-btn ' + (t.registered ? 'up-btn--soft' : 'up-btn--gold') + ' up-btn--sm" data-reg="' + t.id + '">' +
    (t.registered ? 'Отменить' : 'Записаться') + '</button></div></div>'
  ).join('');
}

function renderRating(){
  document.getElementById('ratingList').innerHTML = DATA.rating.map(r =>
    '<div class="rank' + (r.me ? ' rank--me' : '') + '">' +
    '<div class="no">' + r.place + '</div>' +
    '<div class="up-avatar" style="width:34px;height:34px;font-size:11px">' + initials(r.name) + '</div>' +
    '<div class="nm">' + esc(r.me ? 'Вы · ' + r.name : r.name) + '<small>' + r.games + ' турниров</small></div>' +
    '<div class="pt">' + fmt(r.points) + '</div></div>'
  ).join('');
}

function renderProfile(){
  const m = DATA.me;
  document.getElementById('idcard').innerHTML =
    '<div class="wm2">&#9824;</div>' +
    '<div class="top"><span>UNION POKER</span><span style="font-family:var(--up-font-ui);font-weight:800;letter-spacing:0;color:var(--up-gold-dim)">№ ' + m.number + '</span></div>' +
    '<div class="who"><div class="up-avatar up-avatar--lg">' + initials(m.name) + '</div>' +
    '<div><b>' + esc(m.name) + '</b><small>@' + esc(m.username) + ' · в клубе с ' + m.since + '</small></div></div>' +
    '<div class="st">' +
      '<div><b>#' + m.rank + '</b><small>место</small></div>' +
      '<div><b>' + fmt(m.points) + '</b><small>очков</small></div>' +
      '<div><b>' + m.tournaments + '</b><small>турниров</small></div>' +
      '<div><b>' + m.best + '</b><small>лучшее</small></div>' +
    '</div>';

  document.getElementById('history').innerHTML = DATA.history.map(h =>
    '<div class="up-row"><div class="up-row__body"><div class="up-row__title">' + esc(h.title) + '</div>' +
    '<div class="up-row__sub">' + esc(h.date) + ' · ' + h.place + ' место из ' + h.of + '</div></div>' +
    '<span class="up-chip">+' + h.points + '</span></div>'
  ).join('') || '<div class="up-empty">Турниров пока нет</div>';
}

/* ---------- навигация ---------- */
function go(name){
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('screen--on', s.id === 'sc-' + name));
  document.querySelectorAll('.up-tab').forEach(t => t.classList.toggle('up-tab--active', t.dataset.go === name));
  window.scrollTo({ top: 0 });
}

document.addEventListener('click', e => {
  const nav = e.target.closest('[data-go]');
  if (nav) { e.preventDefault(); go(nav.dataset.go); return; }

  const reg = e.target.closest('[data-reg]');
  if (reg) { onRegister(+reg.dataset.reg); }
});

async function onRegister(id){
  const t = DATA.tournaments.find(x => x.id === id);
  if (!t) return;

  if (DEMO) {                       // режим примера, без сервера
    if (t.registered) { t.registered = false; t.taken--; toast('Запись отменена'); }
    else if (t.seats - t.taken <= 0) { toast('Свободных мест нет'); return; }
    else { t.registered = true; t.taken++; toast('Вы записаны'); }
    renderHome(); renderAfisha();
    return;
  }

  const res = await apiPost('/register', { action: t.registered ? 'cancel' : 'register' });
  if (res.ok) {
    t.registered = !t.registered;
    if (typeof res.taken === 'number') t.taken = res.taken;
    haptic('success');
  } else {
    haptic('error');
  }
  toast(res.message || res.error || 'Не получилось');
  renderHome(); renderAfisha();
}

/* ---------- старт ---------- */
(async function start(){
  try { DATA = await loadData(); }
  catch (err) { document.querySelector('.app').innerHTML = '<div class="up-empty">Не удалось загрузить данные.<br>Проверьте связь и откройте приложение снова.</div>'; return; }

  const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  if (u) DATA.me.name = [u.first_name, u.last_name].filter(Boolean).join(' ') || DATA.me.name;
  document.getElementById('me').textContent = initials(DATA.me.name);

  renderHome(); renderAfisha(); renderRating(); renderProfile();

  if (DEMO) {                       // честно предупреждаем, что данные показательные
    const d = document.createElement('div');
    d.className = 'up-chip up-chip--warn';
    d.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);top:8px;z-index:30';
    d.textContent = 'Пример данных · ' + (DEMO_REASON || 'откройте из бота');
    document.body.appendChild(d);
  }
})();
</script>
