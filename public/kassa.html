<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Union Poker — касса турнира</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=Manrope:wght@500;600;700;800&display=swap"
      media="print" onload="this.media='all'">
<link rel="stylesheet" href="union-poker-ui.css">
<style>
  html,body{background:var(--up-bg);margin:0;}
  body{font-family:var(--up-font-ui);color:var(--up-ink);
       padding:env(safe-area-inset-top) 0 calc(92px + env(safe-area-inset-bottom,0px));}
  .wrap{max-width:560px;margin:0 auto;padding:0 14px;}
  .up-logo{background-image:url(logo.png);}

  /* ---------- шапка ---------- */
  .hd2{display:flex;align-items:center;gap:8px;margin-left:auto;}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--up-ok);box-shadow:0 0 8px var(--up-ok);flex:none;}
  .dot.bad{background:var(--up-bad);box-shadow:0 0 8px var(--up-bad);}
  .ico{width:34px;height:34px;padding:0;border-radius:11px;font-size:15px;line-height:1;flex:none;}

  /* ---------- полоса стадии ---------- */
  .stage{background:linear-gradient(150deg,#241D0F,#12100A);border:1.5px solid rgba(212,175,90,.5);
         border-radius:18px;padding:13px 15px;margin-bottom:12px;}
  .stage .ttl{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15.5px;}
  .stage small{display:block;color:var(--up-muted);font-size:12.5px;font-weight:600;
               margin-top:5px;line-height:1.45;}
  .stage .up-btn{margin-top:11px;}
  .stage .dot--wait{background:var(--up-gold-2);box-shadow:0 0 8px var(--up-gold-2);}
  .stage .dot--fin{background:var(--up-warn);box-shadow:0 0 8px var(--up-warn);}

  /* ---------- деньги ---------- */
  .cash{background:linear-gradient(150deg,#241D0F,#12100A);border:1.5px solid rgba(212,175,90,.5);
        border-radius:20px;padding:14px 18px;display:flex;justify-content:space-between;
        align-items:center;margin-bottom:12px;}
  .cash b{display:block;font:400 32px/1 var(--up-font-display);color:var(--up-gold-text);margin-top:6px;}
  .cash .det{text-align:right;font:600 13px/1.6 var(--up-font-ui);color:var(--up-muted);}

  /* ---------- фильтры ---------- */
  .fil{display:flex;gap:7px;overflow-x:auto;margin-bottom:12px;padding-bottom:3px;
       scrollbar-width:none;}
  .fil::-webkit-scrollbar{display:none;}
  .fil button{flex:none;padding:9px 13px;font-size:13px;font-weight:700;border-radius:14px;
              background:var(--up-surface);border:1.5px solid var(--up-line);color:var(--up-muted);}
  .fil button.on{background:linear-gradient(150deg,#F0DFAE,#D4AF5A);border-color:transparent;color:#1A160E;}
  .fil b{font-weight:800;}

  /* ---------- карточка игрока ---------- */
  .pl{background:var(--up-surface);border:1.5px solid var(--up-line);border-radius:18px;
      padding:12px 14px;margin-bottom:10px;}
  .pl.out{opacity:.5;}
  .pl .hd{display:flex;align-items:center;gap:10px;}
  .pl .nm{flex:1;min-width:0;font-weight:800;font-size:16px;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pl .sub{color:var(--up-muted);font-size:12.5px;font-weight:600;margin-top:4px;line-height:1.4;}
  .pl .act{display:flex;gap:8px;margin-top:11px;}
  .pl .act .up-btn{flex:1;padding:13px 4px;font-size:14.5px;font-weight:800;border-radius:13px;}
  .more{width:36px;height:36px;padding:0;border-radius:11px;font-size:17px;line-height:1;flex:none;}
  .b-in{background:var(--up-ok-bg);color:var(--up-ok);border-color:rgba(111,217,162,.35);}
  .b-out{background:var(--up-bad-bg);color:var(--up-bad);border-color:rgba(224,104,122,.35);}
  .b-gold{background:linear-gradient(150deg,#F0DFAE,#D4AF5A);color:#1A160E;border-color:transparent;}
  .seatbadge{display:inline-block;padding:2px 8px;border-radius:9px;font-size:11.5px;font-weight:800;
             background:rgba(212,175,90,.14);color:var(--up-gold-text);}
  .noseat{display:inline-block;padding:2px 8px;border-radius:9px;font-size:11.5px;font-weight:800;
          background:var(--up-warn-bg,rgba(230,180,80,.15));color:var(--up-warn);}
  .prow{display:block;width:100%;text-align:left;background:var(--up-surface-2);
        border:1px solid var(--up-line);border-radius:12px;padding:9px 11px;margin-bottom:6px;
        color:inherit;font:inherit;cursor:pointer;}
  .prow b{display:block;font-size:14.5px;font-weight:800;}
  .prow small{display:block;color:var(--up-muted);font-size:12px;margin-top:2px;}
  .prow .no{color:var(--up-bad);}
  .mi.off{opacity:.55;}
  .nodocs{display:inline-block;padding:2px 8px;border-radius:9px;font-size:11.5px;font-weight:800;
          background:var(--up-bad-bg,rgba(224,104,122,.15));color:var(--up-bad);}
  .idok{display:inline-block;padding:2px 8px;border-radius:9px;font-size:11.5px;font-weight:800;
        background:var(--up-ok-bg,rgba(120,200,140,.14));color:var(--up-ok);}

  /* ---------- карта столов ---------- */
  .tb{background:var(--up-surface);border:1.5px solid var(--up-line);border-radius:18px;
      padding:12px 13px;margin-bottom:11px;}
  .tb__h{display:flex;align-items:baseline;gap:9px;margin-bottom:10px;}
  .tb__h b{font:400 19px/1 var(--up-font-display);color:var(--up-gold-text);}
  .tb__h span{margin-left:auto;color:var(--up-muted);font-size:12px;font-weight:700;}
  .seats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
  .seat{min-height:56px;border-radius:13px;padding:8px 7px;text-align:left;
        background:rgba(255,255,255,.04);border:1.5px solid var(--up-line);
        display:flex;flex-direction:column;justify-content:center;cursor:pointer;}
  .seat i{font-style:normal;display:block;font:700 9.5px var(--up-font-ui);color:var(--up-muted);
          letter-spacing:.1em;margin-bottom:3px;}
  .seat b{font-size:12.5px;font-weight:800;line-height:1.2;overflow-wrap:break-word;}
  .seat b.sm{font-size:11px;letter-spacing:-.2px;}
  .seat.free{border-style:dashed;opacity:.55;}
  .seat.free b{font-weight:600;color:var(--up-muted);}
  .seat.pick{border-color:var(--up-gold-2);background:rgba(212,175,90,.14);}
  .seat.house{border-style:dashed;border-color:rgba(212,175,90,.5);background:rgba(212,175,90,.07);}
  .seat.house i{color:var(--up-gold-dim);}
  .warn{background:var(--up-bad-bg);border:1px solid rgba(224,104,122,.35);color:var(--up-bad);
        border-radius:12px;padding:8px 11px;font-size:12.5px;font-weight:700;
        line-height:1.4;margin-bottom:9px;}

  /* ---------- общее ---------- */
  .bar{position:fixed;left:0;right:0;bottom:0;background:rgba(10,9,7,.96);
       border-top:1px solid var(--up-line);
       padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));backdrop-filter:blur(8px);}
  .bar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .bar .up-btn{padding:13px 6px;font-size:14px;font-weight:800;}
  .done{background:linear-gradient(150deg,#241D0F,#12100A);border:1.5px solid rgba(212,175,90,.5);
        border-radius:18px;padding:13px 15px;margin-bottom:12px;font-size:13.5px;
        line-height:1.5;color:var(--up-muted);}
  .done .up-btn{margin-top:10px;}
  .mi{justify-content:flex-start;text-align:left;font-size:13.5px;padding:12px 14px;line-height:1.35;}
  .mi b{font-weight:800;}
  .danger{color:var(--up-bad);border-color:rgba(224,104,122,.35);}
  #sheetText{white-space:pre-line;}
  .sheetScroll{max-height:60vh;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .help{font-size:13.5px;line-height:1.55;color:var(--up-muted);}
  .help h3{font:400 18px/1.2 var(--up-font-display);color:var(--up-gold-text);margin:16px 0 6px;}
  .help h3:first-child{margin-top:0;}
  .help b{color:var(--up-ink);}
  .help p{margin:0 0 9px;}

  /* финальный стол */
  .fin{background:linear-gradient(150deg,#241D0F,#12100A);border:1.5px solid rgba(212,175,90,.5);
       border-radius:18px;padding:13px 14px;margin-bottom:12px;}
  .fin__h{font:400 19px/1 var(--up-font-display);color:var(--up-gold-text);margin-bottom:11px;}
  .fin__g{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
  .box{background:rgba(255,255,255,.04);border:1px solid var(--up-line);border-radius:13px;
       padding:9px 8px;min-height:56px;display:flex;flex-direction:column;justify-content:center;}
  .box i{font:700 9.5px var(--up-font-ui);color:var(--up-muted);letter-spacing:.12em;
         font-style:normal;display:block;margin-bottom:3px;}
  .box b{font-size:12.5px;font-weight:800;line-height:1.25;word-break:break-word;}
  .box--free{opacity:.4;}
  .box--free b{font-weight:600;}
</style>
</head>
<body>
<div class="wrap">
  <div class="up-header">
    <div class="up-logo"></div>
    <div style="min-width:0;flex:1">
      <div style="font:400 19px/1.1 var(--up-font-display);white-space:nowrap;overflow:hidden;
                  text-overflow:ellipsis" id="tname">Касса турнира</div>
      <div class="up-muted" style="font-size:11.5px;margin-top:4px;white-space:nowrap;
                  overflow:hidden;text-overflow:ellipsis" id="tdate">—</div></div>
    <div class="hd2">
      <span class="dot" id="conn" title="связь с сервером"></span>
      <button class="up-btn up-btn--sm" id="btnHelp">Справка</button>
    </div>
  </div>

  <div id="doneBar"></div>
  <div id="stageBar"></div>
  <div id="koBox"></div>
<div id="finalBox"></div>

  <!-- ===== экран кассы ===== -->
  <section id="scList">
    <div class="cash">
      <div><span class="up-label">Выручка за вечер</span><b id="total">0 ₽</b></div>
      <div class="det" id="money">—</div>
    </div>

    <div class="up-grid-4" id="tiles" style="margin-bottom:12px">
      <div class="up-tile"><b id="s_alive">0</b><small>В ИГРЕ</small></div>
      <div class="up-tile"><b id="s_in">0</b><small>ВХОДОВ</small></div>
      <div class="up-tile"><b id="s_re">0</b><small>РЕБАЕВ</small></div>
      <div class="up-tile" id="tile_ad"><b id="s_ad">0</b><small>АДДОНОВ</small></div>
    </div>

    <div class="fil" id="filters"></div>

    <input class="up-input" id="q" type="search" placeholder="Поиск по нику"
           autocomplete="off" style="margin-bottom:12px">
    <div id="list"></div>
  </section>

  <!-- ===== экран столов ===== -->
  <section id="scSeats" style="display:none">
    <div class="done" id="seatHint"></div>
    <div id="seatMap"></div>
  </section>
</div>

<div class="bar"><div class="in">
  <button class="up-btn up-btn--gold" id="btnAdd">+ Игрок</button>
  <button class="up-btn" id="btnSeats">Столы</button>
  <button class="up-btn" id="btnBack" style="display:none">К кассе</button>
  <button class="up-btn" id="btnMore">Ещё</button>
</div></div>

<div class="up-sheet" id="sheet"><div class="up-sheet__box">
  <div class="up-sheet__grab"></div>
  <h2 class="up-h2" id="sheetTitle">Заголовок</h2>
  <p class="up-muted" id="sheetText" style="font-size:14px;margin:6px 0 14px"></p>
  <div id="sheetHtml" class="sheetScroll" style="display:none;margin-bottom:12px"></div>
  <div class="up-field" id="sheetField"><input class="up-input" id="sheetInput" type="text"></div>
  <div class="up-field" id="sheetArea" style="display:none"><textarea class="up-input" id="sheetText2"
       rows="6" style="resize:vertical;min-height:120px;line-height:1.45"></textarea></div>
  <div id="sheetMenu" class="sheetScroll" style="display:none;flex-direction:column;gap:8px;margin-bottom:12px"></div>
  <div style="display:flex;gap:10px">
    <button class="up-btn up-btn--ghost" style="flex:1" id="sheetCancel">Отмена</button>
    <button class="up-btn up-btn--gold" style="flex:1" id="sheetOk">Готово</button>
  </div>
</div></div>

<div class="up-toast" id="toast"></div>

<script>
/* =========================================================
   Касса турнира Union Poker.

   Всё состояние живёт на сервере, не в браузере: кассу можно
   открыть одновременно на телефоне и ноутбуке, цифры совпадут.

   Два экрана: список игроков и карта столов.
   ========================================================= */
const API = '/api/admin';
let KEY = '';
try { KEY = localStorage.getItem('up_admin_key') || ''; } catch(e) {}
let STATE = null, VIEW = 'list', FILTER = 'all', PICK = null;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const fmt = n => String(Math.round(n||0)).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const word = (n,a,b,c) => { const t=Math.abs(n)%100, k=t%10;
  return (t>10&&t<20)?c:(k>1&&k<5)?b:(k===1)?a:c; };

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('up-toast--on');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('up-toast--on'), 2200);
}

/* ---------- шторки ---------- */
function closeSheet(){
  $('sheet').classList.remove('up-sheet--open');
  $('sheetMenu').style.display = 'none'; $('sheetMenu').innerHTML = '';
  $('sheetHtml').style.display = 'none'; $('sheetHtml').innerHTML = '';
  $('sheetField').style.display = ''; $('sheetOk').style.display = '';
  $('sheetArea').style.display = 'none';
}

function ask(title, text, value, type){
  // type === 'area' — многострочное поле, для текста о мероприятии
  const area = type === 'area';
  return new Promise(resolve => {
    $('sheetTitle').textContent = title;
    $('sheetText').textContent = text || '';
    $('sheetInput').type = area ? 'text' : (type || 'text');
    $('sheetInput').value = area ? '' : (value || '');
    $('sheetText2').value = area ? (value || '') : '';
    $('sheetField').style.display = (value === null || area) ? 'none' : '';
    $('sheetArea').style.display = area ? '' : 'none';
    $('sheetMenu').style.display = 'none';
    $('sheetHtml').style.display = 'none';
    $('sheetOk').style.display = '';
    $('sheet').classList.add('up-sheet--open');
    if (value !== null) setTimeout(() => (area ? $('sheetText2') : $('sheetInput')).focus(), 80);
    const done = v => { $('sheetArea').style.display = 'none'; closeSheet(); resolve(v); };
    $('sheetOk').onclick = () => done((area ? $('sheetText2').value : $('sheetInput').value).trim());
    $('sheetCancel').onclick = () => done(null);
  });
}

// подтверждение опасного действия: жмём кнопку, а не пишем слова
function confirmDo(title, text, okLabel){
  return new Promise(resolve => {
    $('sheetTitle').textContent = title;
    $('sheetText').textContent = text || '';
    $('sheetField').style.display = 'none';
    $('sheetHtml').style.display = 'none';
    $('sheetMenu').style.display = 'none';
    $('sheetOk').style.display = '';
    $('sheetOk').textContent = okLabel || 'Да';
    $('sheet').classList.add('up-sheet--open');
    const done = v => { $('sheetOk').textContent = 'Готово'; closeSheet(); resolve(v); };
    $('sheetOk').onclick = () => done(true);
    $('sheetCancel').onclick = () => done(false);
  });
}

function menu(title, text, items){
  return new Promise(resolve => {
    $('sheetTitle').textContent = title;
    $('sheetText').textContent = text || '';
    $('sheetField').style.display = 'none';
    $('sheetHtml').style.display = 'none';
    $('sheetOk').style.display = 'none';
    const box = $('sheetMenu');
    box.style.display = 'flex';
    box.innerHTML = items.map((it, i) =>
      '<button class="up-btn up-btn--block ' + (it.cls || '') + '" data-mi="' + i + '">' +
      esc(it.label) + '</button>').join('');
    $('sheet').classList.add('up-sheet--open');
    const done = v => { closeSheet(); resolve(v); };
    box.onclick = ev => {
      const b = ev.target.closest('[data-mi]');
      if (b) done(items[+b.dataset.mi].id);
    };
    $('sheetCancel').onclick = () => done(null);
  });
}

function show(title, html){
  $('sheetTitle').textContent = title;
  $('sheetText').textContent = '';
  $('sheetField').style.display = 'none';
  $('sheetMenu').style.display = 'none';
  $('sheetOk').style.display = 'none';
  const box = $('sheetHtml');
  box.style.display = ''; box.innerHTML = html;
  $('sheet').classList.add('up-sheet--open');
  $('sheetCancel').onclick = closeSheet;
}

/* ---------- запросы ---------- */
async function get(path){
  const r = await fetch(API + path + '?key=' + encodeURIComponent(KEY));
  if (r.status === 403) throw new Error('Неверный ключ');
  return await r.json();
}
// Интернет в клубе бывает слабым. Запрос не может висеть вечно: через
// 12 секунд обрываем и честно говорим, что не дошло. Нажатие при этом не
// теряется молча — кассир видит сообщение и повторяет.
async function post(path, body){
  const ctl = (typeof AbortController === 'function') ? new AbortController() : null;
  const timer = setTimeout(() => { if (ctl) ctl.abort(); }, 12000);
  try {
    const r = await fetch(API + path + '?key=' + encodeURIComponent(KEY), {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body||{}), signal: ctl ? ctl.signal : undefined
    });
    if (r.status === 403) return { ok:false, message:'Неверный ключ доступа' };
    return await r.json();
  } catch (e) {
    const slow = e && (e.name === 'AbortError');
    return { ok:false, offline:true, message: slow
      ? 'Сервер не ответил за 12 секунд. Проверьте связь и нажмите ещё раз'
      : 'Нет связи с сервером. Нажмите ещё раз' };
  } finally {
    clearTimeout(timer);
  }
}

/* ---------- кто есть кто ---------- */
// Состояние игрока одним словом — от него зависит и вид карточки, и главная кнопка.
function kind(p, stage){
  if (p.busted && p.place) return 'out';            // выбыл, место присвоено
  if (p.busted) return 'nostack';                   // нет стека, может взять ребай
  if (!p.arrived) return p.wait ? 'wait' : 'unpaid';
  return 'play';                                    // за столом
}
const KIND_CHIP = {
  out:     '<span class="up-chip up-chip--bad">#PLACE# место</span>',
  nostack: '<span class="up-chip up-chip--warn">нет стека</span>',
  wait:    '<span class="up-chip up-chip--warn">лист ожидания</span>',
  unpaid:  '<span class="up-chip">не оплатил</span>',
  play:    '<span class="up-chip up-chip--ok">в игре</span>'
};

/* ---------- отрисовка ---------- */
function render(){
  if (!STATE) return;
  const t = STATE.tournament, m = STATE.money || {};
  const st = t.stage || 'rebuy';

  $('tname').textContent = t.title || 'Касса турнира';
  $('tdate').innerHTML = (t.weekday ? t.weekday + ', ' : '') + (t.date || '') + ' · ' +
    (t.time || '') + (STATE.pinned ? ' · выбран вручную' : '') +
    (t.status === 'finished' ? ' · <b style="color:var(--up-warn)">завершён</b>'
     : t.status === 'live' ? ' · <b style="color:var(--up-ok)">идёт</b>' : '');

  // полоса стадии
  const dotCls = st === 'rebuy' ? '' : st === 'addon' ? ' dot--wait' : ' dot--fin';
  $('stageBar').innerHTML = (t.status !== 'live') ? '' :
    '<div class="stage">' +
      '<div class="ttl"><span class="dot' + dotCls + '"></span>' + esc(t.stage_text || '') + '</div>' +
      '<small>' + esc(t.stage_hint || '') + '</small>' +
      (t.next_stage
        ? '<button class="up-btn up-btn--gold up-btn--block" data-stage="' + t.next_stage + '">' +
          esc(t.next_label || '') + '</button>'
        : '') +
    '</div>';

  // финальный стол
  const fin = STATE.final || [];
  // фишки за нокауты — показываем, как только их начали считать
  $('koBox').innerHTML = (STATE.chips || []).length
    ? '<div class="up-card" style="padding:12px 13px;margin-bottom:11px">' +
      '<div class="up-row__sub" style="margin-bottom:7px">Фишки за нокауты · ' +
      (STATE.chip_points || 10) + ' очков за фишку</div>' +
      (STATE.chips || []).slice(0, 8).map(k =>
        '<div style="display:flex;justify-content:space-between;padding:4px 0;font-weight:700">' +
        '<span>' + esc(k.name) + '</span><span class="up-chip">' + k.n + '</span></div>').join('') +
      '</div>'
    : '';

  $('finalBox').innerHTML = (st === 'final' && fin.length)
    ? '<div class="fin"><div class="fin__h">Финальный стол</div><div class="fin__g">' +
      fin.map(b => '<div class="box' + (b.name ? '' : ' box--free') + '">' +
        '<i>МЕСТО ' + b.seat + '</i><b>' + (b.name ? esc(b.name) : 'свободно') + '</b></div>').join('') +
      '</div></div>'
    : '';

  $('doneBar').innerHTML = t.status === 'finished'
    ? '<div class="done">Турнир завершён, очки начислены. Список не стираем: на нём держатся ' +
      'рейтинг и история в профилях. Как только в афише появится следующий турнир, ' +
      'касса перейдёт на него сама.' +
      '<button class="up-btn up-btn--gold up-btn--sm up-btn--block" data-new="1">Добавить турнир в афишу</button></div>'
    : (t.status === 'open' && t.starts_in > 0
        ? '<div class="done">До начала ' + hhmm(t.starts_in) + '. Записавшиеся уже в списке — ' +
          'отмечайте вход, когда игроки придут. За 10 минут до старта турнир откроется сам.</div>'
        : '');

  $('total').textContent = fmt(STATE.total) + ' ₽';
  $('money').innerHTML =
    'входы ' + fmt((m.buyin||{}).sum) + ' ₽<br>' +
    (t.reentry ? 'ребаи ' + fmt((m.reentry||{}).sum) + ' ₽' : 'без ребаев') +
    (t.addon ? '<br>аддоны ' + fmt((m.addon||{}).sum) + ' ₽' : '');
  $('tile_ad').style.display = t.addon ? '' : 'none';
  $('tiles').className = t.addon ? 'up-grid-4' : 'up-grid-3';
  $('s_alive').textContent = STATE.alive;
  $('s_in').textContent = (m.buyin||{}).n || 0;
  $('s_re').textContent = (m.reentry||{}).n || 0;
  $('s_ad').textContent = (m.addon||{}).n || 0;

  if (VIEW === 'seats') { renderSeats(); return; }
  renderList();
}

function renderList(){
  const t = STATE.tournament, st = t.stage || 'rebuy';
  const all = (STATE.players || []).filter(p => !p.house);
  const sm = STATE.seatmap || {tables:[], noseat:[]};
  const seatOf = {};
  (sm.tables||[]).forEach(tb => tb.seats.forEach(s => { if (s.player_id) seatOf[s.player_id] = tb.table + '/' + s.seat; }));

  // фильтры со счётчиками — чтобы быстро найти нужных
  const groups = {
    all:     all,
    play:    all.filter(p => kind(p) === 'play'),
    noseat:  all.filter(p => kind(p) === 'play' && !seatOf[p.id]),
    nostack: all.filter(p => kind(p) === 'nostack'),
    unpaid:  all.filter(p => kind(p) === 'unpaid' || kind(p) === 'wait'),
    out:     all.filter(p => kind(p) === 'out'),
    nodocs:  all.filter(p => !p.docs)
  };
  const tabs = [
    ['all','Все'], ['play','За столами'], ['noseat','Без места'],
    ['nostack','Без стека'], ['unpaid','Не оплатили'], ['out','Выбыли'],
    ['nodocs','Без документов']
  ].filter(([k]) => k === 'all' || groups[k].length);
  if (!groups[FILTER] || !groups[FILTER].length) FILTER = 'all';
  $('filters').innerHTML = tabs.map(([k,label]) =>
    '<button data-filter="' + k + '" class="' + (k===FILTER?'on':'') + '">' +
    label + ' <b>' + groups[k].length + '</b></button>').join('');

  const query = ($('q').value || '').toLowerCase().trim();
  const list = groups[FILTER].filter(p => !query || p.name.toLowerCase().includes(query));
  const box = $('list');

  if (!all.length) {
    box.innerHTML = '<div class="up-empty">Пока никто не записан.<br>' +
      'Игроки появятся, когда запишутся в приложении. Пришедшего без записи ' +
      'добавьте кнопкой «+ Игрок».</div>';
    return;
  }
  if (!list.length) { box.innerHTML = '<div class="up-empty">Никого не найдено</div>'; return; }

  box.innerHTML = list.map(p => {
    const k = kind(p);
    const chip = (KIND_CHIP[k] || '').replace('#PLACE#', p.place);
    const bits = [];
    bits.push('№ ' + p.number);
    if (seatOf[p.id]) {
      const [tb, s] = seatOf[p.id].split('/');
      bits.push('<span class="seatbadge">стол ' + tb + ' · место ' + s + '</span>');
    } else if (k === 'play') {
      bits.push('<span class="noseat">без места</span>');
    }
    if (p.reentry) bits.push('ребай ×' + p.reentry);
    if (p.addon)   bits.push('аддон ×' + p.addon);
    if (p.chips)   bits.push('<span class="seatbadge">фишек ' + p.chips + '</span>');
    if (!p.docs)   bits.push('<span class="nodocs">нет документов</span>');
    else if (p.id_ok) bits.push('<span class="idok">паспорт ✓</span>');

    // одно главное действие — крупное, остальное в «···»
    let act = '';
    if (k === 'unpaid' || k === 'wait') {
      act = btn('buyin', 'Вход · ' + fmt(t.buyin) + ' ₽', 'b-in', p.id);
    } else if (k === 'nostack') {
      act = !t.reentry
        ? '<button class="up-btn" disabled style="flex:1;opacity:.5">Freezeout — ребаев нет</button>'
        : (st === 'rebuy' || st === 'addon')
          ? btn('reentry', 'Ребай · ' + fmt(t.reentry) + ' ₽', 'b-gold', p.id)
          : '<button class="up-btn" disabled style="flex:1;opacity:.5">Ребаев больше нет</button>';
    } else if (k === 'play') {
      if (st === 'addon' && t.addon && !p.addon) act += btn('addon', 'Аддон · ' + fmt(t.addon) + ' ₽', 'b-in', p.id);
      act += btn('bust', (st === 'rebuy' && t.reentry) ? 'Нет стека' : 'Выбыл', 'b-out', p.id);
    }

    return '<div class="pl' + (k === 'out' ? ' out' : '') + '">' +
      '<div class="hd"><div class="nm">' + esc(p.name) + '</div>' + chip +
      '<button class="up-btn more" data-more="' + p.id + '">···</button></div>' +
      '<div class="sub">' + bits.join(' · ') + '</div>' +
      (act ? '<div class="act">' + act + '</div>' : '') +
    '</div>';
  }).join('');
}

function btn(op, label, cls, id){
  return '<button class="up-btn ' + cls + '" data-op="' + op + '" data-id="' + id + '">' +
         esc(label) + '</button>';
}

function hhmm(min){
  if (min >= 1440) { const d = Math.round(min/1440); return d + ' ' + word(d,'день','дня','дней'); }
  const h = Math.floor(min/60), m = min%60;
  return (h ? h + ' ч ' : '') + m + ' мин';
}

  $('seatHint').innerHTML = sm.auto

        'data-house="' + (s.house ? 1 : 0) + '">' +
        '<i>' + (s.house ? 'ДОБОР' : 'МЕСТО ' + s.seat) + '</i>' +
        '<b class="' + ((s.name || '').length > 10 ? 'sm' : '') + '">' +
        (s.player_id ? esc(s.name) : 'свободно') + '</b></div>'
      ).join('') + '</div></div>').join('') +
    '<button class="up-btn up-btn--block" data-collapse="1" style="margin-top:4px">' +

async function seatTap(table, seat, pid, house){
  const sm = STATE.seatmap || {};
  if (pid && house) {
    const p = (STATE.players || []).find(x => x.id === pid);
    const act = await menu(p ? p.name : 'Управляющий',
      'Сидит на доборе, стол ' + table + ', место ' + seat +
      '. В турнире не участвует: ни очков, ни места.', [
      { id:'move', label:'Пересадить на другое место', cls:'up-btn--gold mi' },
      { id:'off',  label:'Встать из-за стола', cls:'mi danger' }
    ]);
    if (act === 'move') { PICK = pid; toast('Теперь нажмите, куда пересадить'); return; }
    if (act === 'off') {
      const r = await post('/house-remove', { player_id: pid });
      toast(r.message || 'Готово'); refresh(true);
    }
    return;
  }
  if (pid) {
    const p = (STATE.players || []).find(x => x.id === pid);
    const act = await menu(p ? p.name : 'Игрок', 'Стол ' + table + ', место ' + seat, [
      { id:'move',  label:'Пересадить на другое место', cls:'up-btn--gold mi' },
      { id:'free',  label:'Поднять с места', cls:'mi' },
      { id:'bust',  label:'Отметить выбывание', cls:'mi danger' }
    ]);
    if (act === 'move') { PICK = pid; toast('Теперь нажмите, куда пересадить'); return; }
    if (act === 'free') {
      const r = await post('/seat-free', { player_id: pid });
      toast(r.message || 'Готово'); refresh(true); return;
    }
    if (act === 'bust') {
      const r = await post('/op', { player_id: pid, op: 'bust' });
      toast(r.message || 'Готово'); refresh(true); return;
    }
    return;
  }

  // свободное место: либо сажаем выбранного, либо выбираем из списка
  if (PICK) {
    const r = await post('/seat-set', { player_id: PICK, table, seat });
    PICK = null; toast(r.message || 'Готово'); refresh(true); return;
  }
  const free = (sm.noseat || []).slice();
  const seated = (STATE.players || []).filter(p => kind(p) === 'play' &&
    !free.some(f => f.player_id === p.id));
  const items = free.map(p => ({ id:'p' + p.player_id, label:p.name + ' · ждёт места', cls:'up-btn--gold mi' }))
    .concat(seated.map(p => ({ id:'p' + p.id, label:p.name + ' · пересадить сюда', cls:'mi' })));
  items.push({ id:'house', label:'Посадить управляющего на добор', cls:'mi' });
  const act = await menu('Стол ' + table + ', место ' + seat, 'Кого посадить сюда?', items);
  if (!act) return;
  if (act === 'house') {
    const nm = await ask('Управляющий на добор',
      'Он сядет играть, чтобы стол не простаивал. В турнире не участвует: ' +
      'ни очков, ни места, ни в подсчёте игроков.', 'Управляющий');
    if (!nm) return;
    const r = await post('/house-add', { name: nm, table, seat });
    toast(r.message || 'Готово'); refresh(true); return;
  }
  const r = await post('/seat-set', { player_id: +act.slice(1), table, seat });
  toast(r.message || 'Готово'); refresh(true);
}

/* ---------- загрузка ---------- */
async function refresh(silent){
  try{
    STATE = await get('/state');
    $('conn').classList.remove('bad');
    render();
  }catch(e){
    $('conn').classList.add('bad');
    if (!silent) toast(e.message === 'Неверный ключ' ? 'Неверный ключ доступа' : 'Нет связи с сервером');
  }
}

/* ---------- меню игрока ---------- */
async function playerMenu(id){
  const p = (STATE.players || []).find(x => x.id === id);
  if (!p) return;
  const k = kind(p);
  const items = [];
  if (k === 'play') items.push({ id:'seat', label:'Посадить или пересадить', cls:'up-btn--gold mi' });
  if (p.busted) items.push({ id:'unbust', label:'Вернуть в игру — отметили по ошибке', cls:'up-btn--gold mi' });
  if (k === 'play') items.push({ id:'bust', label:'Отметить выбывание', cls:'mi' });
  items.push({ id:'idok', label: p.id_ok ? 'Снять отметку о документе' : 'Документ проверен, 18+',
               cls:'mi' });
  items.push({ id:'help', label:'Что значат эти кнопки', cls:'mi' });
  items.push({ id:'remove', label:'Стереть запись — ошибка кассира', cls:'mi danger' });

  const sub = k === 'out' ? p.place + ' место'
            : k === 'nostack' ? 'нет стека, может взять ребай'
            : k === 'play' ? 'за столом'
            : 'вход не оплачен';
  const docs = p.docs
    ? (p.fio ? ' · ' + p.fio : '') + (p.id_ok ? ' · документ проверен ' + p.id_ok : '')
    : ' · ДОКУМЕНТЫ НЕ ПОДПИСАНЫ';
  const act = await menu(p.name, '№ ' + p.number + ' · ' + sub + docs, items);

  if (act === 'seat'){ VIEW = 'seats'; PICK = id; switchView(); toast('Нажмите место, куда посадить'); return; }
  if (act === 'bust'){
    const r = await post('/op', { player_id:id, op:'bust' });
    toast(r.message || 'Готово'); refresh(true); return;
  }
  if (act === 'unbust'){
    const r = await post('/unbust', { player_id: id });
    toast(r.message || 'Готово'); refresh(true); return;
  }
  if (act === 'idok'){
    const r = await post('/id-check', { player_id: id });
    toast(r.message || 'Готово'); refresh(true); return;
  }
  if (act === 'help'){ helpSheet(); return; }
  if (act === 'remove'){
    const paid = (p.reentry||0) + (p.addon||0) + (p.arrived ? 1 : 0);
    const okFirst = await confirmDo('Стереть запись игрока?',
      'Это НЕ выбывание. Если игрок проиграл и ушёл — закройте это окно и нажмите ' +
      '«Выбыл» в его карточке: место сохранится, деньги останутся в кассе.\n\n' +
      'Стирание нужно только когда вы ошиблись: пробили не того человека, ' +
      'или он передумал играть и деньги вернули.' +
      (paid ? '\n\nУ него есть оплаты — они пропадут, выручка уменьшится.' : ''),
      'Я ошибся, стереть');
    if (!okFirst) { toast('Отменено'); return; }
    let r = await post('/remove', { player_id: id });
    if (!r.ok && /оплат/i.test(r.message || '')) {
      const okTwice = await confirmDo('Точно стереть вместе с деньгами?',
        r.message + '\n\nПосле этого вернуть их можно будет только пробив заново.',
        'Да, стереть всё');
      if (!okTwice) { toast('Отменено'); return; }
      r = await post('/remove', { player_id: id, force: true });
    }
    toast(r.message || 'Готово'); refresh(true);
  }
}

/* ---------- справка ---------- */
const HELP = `
<h3>С чего начинается вечер</h3>
<p>Игроки записываются сами в приложении — они уже в списке с отметкой
<b>не оплатил</b>. Пришёл человек без записи: кнопка <b>+ Игрок</b> внизу.</p>

<h3>Вход</h3>
<p>Игрок заплатил — жмёте <b>Вход</b>. Касса запишет деньги и, если включена
автоматическая рассадка, назовёт стол и место. Повторите вслух.</p>

<h3>Нет стека и Ребай</h3>
<p>Пока идёт ребай-период, у выбывшего кнопка называется <b>Нет стека</b>: это не
окончательное выбывание, место за ним не закрепляется. Захотел продолжить —
<b>Ребай</b>, он снова в игре.</p>

<h3>Выбыл</h3>
<p>После перерыва ребаев нет, и кнопка становится <b>Выбыл</b>. Касса сама
присвоит место: если в игре было четырнадцать человек, выбывший получает
четырнадцатое. Этой же кнопкой отмечайте тех, кто ушёл домой.</p>

<h3>Аддон</h3>
<p>Появляется только в перерыве после ребай-периода. Один раз на игрока, 50 000
фишек. У взявшего кнопка гаснет.</p>

<h3>Стадии</h3>
<p>Золотая кнопка вверху переводит турнир дальше: сначала <b>закрыть ребаи</b> —
начинается перерыв с аддоном и поздней регистрацией, потом <b>закончить
перерыв</b> — покупок больше нет. Финальный стол при девяти игроках собирается
сам.</p>

<h3>Столы</h3>
<p>Кнопка <b>Столы</b> внизу — карта всех мест. Нажмите на место, чтобы
посадить, пересадить или поднять игрока.</p>
<p><b>Столы заполняются по очереди.</b> Первый набирается до девяти, десятый
пришедший открывает второй, и так далее. Поровну касса не делит специально:
иначе один живой стол превращается в два полупустых, и сотрудников пришлось бы
сажать сразу за оба.</p>
<p><b>Рассадка не меняется сама.</b> Кого посадили, тот там и сидит: ни вылеты,
ни переход к финалу её не трогают. Пересобрать столы можно только кнопкой
<b>Собрать столы поровну</b> внизу карты — и один раз это произойдёт
автоматически, когда соберётся финальный стол.</p>
<p>Если компания хочет сидеть вместе, переключите рассадку на ручную: тогда
касса не сажает сама, пришедшие ждут в блоке «Ждут места», и вы расставляете
людей как нужно.</p>

<h3>Добор: управляющий за столом</h3>
<p>Стол играет от шести человек. Если людей меньше, касса подсветит стол
красным. Нажмите свободное место и выберите <b>Посадить управляющего на
добор</b> — он сядет играть, чтобы стол не простаивал.</p>
<p>Управляющий на доборе <b>не участвует в турнире</b>: не считается в «в игре»,
не влияет на сбор финального стола, не получает места и очков, не попадает в
рейтинг. На карте его место отмечено пунктиром и словом «ДОБОР».</p>
<p><b>Сотрудники уступают места сами.</b> Как только за столом набирается шесть
живых игроков, добор снимается — касса напишет об этом в ответе на «Вход».
Снимать руками не нужно. Когда соберётся финальный стол, доборы тоже встанут.</p>

<h3>Документы игрока</h3>
<p>Перед первым турниром игрок подписывает в приложении оферту, правила клуба
и согласие на обработку данных. Кто не подписал — не может записаться на турнир,
и в кассе у него красная метка <b>нет документов</b>. Таких видно одним нажатием:
фильтр <b>Без документов</b>.</p>
<p>Человек с красной меткой может прийти и заплатить — касса его пропустит.
Но попросите его открыть приложение и подписать: это минута, а без подписи у
клуба нет согласия на обработку его данных.</p>
<p>Документ, удостоверяющий личность, смотрите на входе сами — приложение его
не хранит. Посмотрели: <b>···</b> → <b>Документ проверен, 18+</b>. В карточке
появится зелёная метка <b>паспорт ✓</b>, и в следующий раз спрашивать не нужно.</p>

<h3>Карточка турнира</h3>
<p><b>Ещё → Афиша клуба</b> → нажать турнир → <b>Настроить карточку</b>. Там всё,
что видит игрок: название, подпись под ним, текст о мероприятии, картинка,
время, вход и число мест.</p>
<p><b>О мероприятии</b> — ваш текст про этот вечер: что разыгрываем, во сколько
сбор, что особенного. Игрок увидит его, открыв турнир в приложении, и он же
уйдёт в рассылку, если отправите её по этому турниру. Пустое поле — текста
просто не будет.</p>
<p>Менять можно только турниры, которые ещё не сыграны. Если сдвинуть время,
расписание не подставит на это место второй турнир: в клубе один турнир в день.</p>

<h3>Фишки за нокауты</h3>
<p>Выбил соперника — получил фишку. Кто кого выбил, касса не отслеживает и во
время игры ничего не спрашивает: фишки на руках у игроков.</p>
<p>В конце вечера, перед завершением турнира: <b>Ещё → Фишки за нокауты</b>.
Список всех игроков, нажимаете на человека и вписываете число сданных фишек.
Одна фишка — <b>10 очков сезона</b>, они добавятся к очкам за место при
завершении турнира.</p>
<p>Сколько у кого фишек, видно на главном экране кассы, в карточке игрока
(«фишек 3») и в приложении у игроков. Исправить можно в любой момент, пока
турнир не завершён — вписали другое число, оно и останется.</p>
<p>Цена фишки лежит в <code>config.json</code>, строка <code>chip_points</code>.</p>

<h3>Форматы турнира</h3>
<p>Карточка турнира называется по формату: Rebuy, Freezeout, Bounty, Deepstack,
Turbo, Mystery Bounty, Main Event. У каждого свой цвет и свой рисунок — игрок
узнаёт формат ещё в ленте, не открывая карточку.</p>
<p>Выбор формата заодно переименует турнир, касса спросит об этом. В
<b>Настройках афиши</b> формат ставится на весь день недели, в
<b>Настроить карточку</b> — только на один вечер.</p>
<p>Формат меняет не только вид, но и сам турнир:</p>
<p><b>Freezeout</b> — ребаи и аддон закрыты, касса их не продаст, а выбывание
сразу даёт место. <b>Deepstack</b> — стек 50 000. <b>Turbo</b> — уровни по
7 минут, таймер берёт это сам. <b>Main Event</b> — стек 40 000 и уровни по
15 минут. <b>Rebuy</b> — как обычно.</p>
<p><b>Bounty</b> и <b>Mystery Bounty</b> — пока только название, вид и описание:
награду за выбитых система не считает, условия объявляет администратор.</p>
<p>Описание формата игрок видит в приложении, открыв турнир. Если вы напишете
свой текст в «О мероприятии», он встанет под описанием формата.</p>

<h3>Настройки афиши</h3>
<p><b>Ещё → Настройки афиши</b> — расписание клуба. Семь строк, по одной на день
недели. Нажали день: играем в него или нет, во сколько, как называется турнир и
какая у него картинка. Там же — на сколько недель вперёд строить афишу и общий
выключатель расписания.</p>
<p>Турниры на эти дни создаются сами. Включили день — они появятся сразу.
Выключили — из афиши уйдут будущие турниры этого дня, но только пустые и только
те, что создало расписание. Где есть записавшиеся или что заводили руками,
останется: такое убирают осознанно, через <b>Афишу клуба</b>.</p>
<p>Расписание задаёт, каким турнир <b>родится</b>. Дальше он живёт сам: правки
в его карточке расписание не трогает.</p>

<h3>Рассылка в бот</h3>
<p><b>Ещё</b> → <b>Рассылка в бот</b> — сообщение всем участникам клуба, у кого
есть Telegram. Касса сначала покажет готовый текст про ближайший турнир и
сколько человек его получат; можно написать и своё сообщение. Отправка только
после подтверждения, отменить её нельзя.</p>
<p>Внизу сообщения у человека будут кнопки «Записаться» и «Открыть приложение».
Кто не хочет такие сообщения — отправляет боту <b>/stop</b>, и рассылка его
больше не трогает. Вернуть — <b>/start</b>.</p>

<h3>Игроки клуба</h3>
<p><b>Ещё</b> → <b>Игроки клуба</b> — весь клуб списком: номер, ник, телефон,
зарегистрирован сам или заведён кассиром, сколько турниров, подписаны ли
документы, с какого числа в клубе. Нажатие на строку открывает карточку с
оплатами и действиями.</p>
<p>Удалить профиль можно только пока у человека нет оплат. С оплатами касса
откажет: деньги вечера считаются по ним, и турнир сойдётся неверно. Для второго
профиля того же человека удаление не нужно — объединяйте.</p>

<h3>Ник занят</h3>
<p>Ник в клубе один на человека: за столом объявляют по нику. Если игрок в
приложении возьмёт занятый — ему так и напишут, и попросят другой. Если занятый
ник вводит кассир, касса покажет, кто его носит, и спросит: это он или другой
человек.</p>

<h3>Двойные профили</h3>
<p>Один человек может оказаться в клубе дважды: сначала его завёл кассир
кнопкой <b>+ Игрок</b>, потом он сам зарегистрировался в приложении. У него
будет два номера и две истории.</p>
<p><b>Ещё</b> → <b>Двойные профили</b> покажет совпадения по имени и телефону.
Касса сама ничего не склеивает: двух разных Александров объединять нельзя.
Решаете вы, и всё переезжает в профиль с меньшим номером — турниры, оплаты,
подписанные документы.</p>

<h3>Копия базы</h3>
<p>Сервер сам делает копию при запуске и каждые три часа, хранит последние
шестьдесят. Перед чем-то рискованным можно сделать копию руками:
<b>Ещё</b> → <b>Сделать копию базы</b>. Это секунда, турнир не прерывается.</p>

<h3>Если ошиблись</h3>
<p>Отметили выбывание зря — <b>···</b> у игрока, затем <b>Вернуть в игру</b>.</p>
<p><b>Стереть запись</b> — только для своих ошибок: пробили не того человека или
вернули деньги. Запись исчезнет вместе с оплатами. Для выбывания это НЕ нужно.</p>

<h3>Завершение</h3>
<p>Когда остался один игрок — <b>Ещё</b> → <b>Завершить турнир</b>. Раньше касса
не даст. Победителю присвоится первое место, всем начислятся очки сезона.</p>

<h3>Если пропала связь</h3>
<p>Точка слева от «?» в шапке краснеет. Нажатия в это время не доходят до
сервера — дождитесь, пока она позеленеет, и повторите последнее действие.</p>
`;
function helpSheet(){ show('Справка по кассе', '<div class="help">' + HELP + '</div>'); }

/* ---------- экраны ---------- */
function switchView(){
  const seats = VIEW === 'seats';
  $('scList').style.display = seats ? 'none' : '';
  $('scSeats').style.display = seats ? '' : 'none';
  $('btnSeats').style.display = seats ? 'none' : '';
  $('btnBack').style.display = seats ? '' : 'none';
  render();
}

/* ---------- нажатия ---------- */
document.addEventListener('click', async e => {
  if (e.target.closest('[data-new]')) { await newTournament(); return; }

  const f = e.target.closest('[data-filter]');
  if (f) { FILTER = f.dataset.filter; render(); return; }

  const md = e.target.closest('[data-mode]');
  if (md) {
    const r = await post('/seat-mode', { mode: md.dataset.mode });
    toast(r.message || 'Готово'); refresh(true); return;
  }

  const col = e.target.closest('[data-collapse]');
  if (col) {
    if (!await confirmDo('Собрать столы поровну?',
      'Все, кто в игре, рассядутся заново на минимально нужное число столов. ' +
      'Доборы встанут. Делайте это между раздачами и объявите новые места.',
      'Собрать')) { toast('Отменено'); return; }
    const r = await post('/rebalance', {});
    toast(r.message || 'Готово'); refresh(true); return;
  }

  const sseat = e.target.closest('[data-seat]');
  if (sseat) {
    const [tb, s] = sseat.dataset.seat.split(':').map(Number);
    await seatTap(tb, s, +sseat.dataset.pid || 0, sseat.dataset.house === '1'); return;
  }

  const ns = e.target.closest('[data-noseat]');
  if (ns) { PICK = +ns.dataset.noseat; toast('Теперь нажмите свободное место'); return; }

  const more = e.target.closest('[data-more]');
  if (more) { await playerMenu(+more.dataset.more); return; }

  const stg = e.target.closest('[data-stage]');
  if (stg) { await changeStage(stg.dataset.stage); return; }

  const b = e.target.closest('[data-op]');
  if (!b) return;
  if (b.disabled) return;              // двойное нажатие — вторая оплата, так нельзя
  b.disabled = true;
  const was = b.textContent;
  b.textContent = 'Отправляю...';
  try {
    const res = await post('/op', { player_id: +b.dataset.id, op: b.dataset.op });
    toast(res.message || 'Готово');

  } finally {
    // кнопку возвращаем всегда, даже если связь оборвалась: иначе она
    // останется серой и будет казаться, что касса зависла
    b.disabled = false;
    b.textContent = was;
  }
  refresh(true);
});

$('q').addEventListener('input', render);
$('btnHelp').onclick = helpSheet;
$('btnSeats').onclick = () => { VIEW = 'seats'; switchView(); };
$('btnBack').onclick  = () => { VIEW = 'list'; PICK = null; switchView(); };

/* ---------- стадии ---------- */
async function changeStage(stage){
  const texts = {
    addon: ['Закрыть ребаи?',
      'Начнётся перерыв: откроются аддон и поздняя регистрация, по 1500 ₽ и по ' +
      '50 000 фишек. Игрокам уйдёт сообщение от бота. Нажимайте, когда закончится ' +
      'последний ребай-уровень.'],
    play: ['Закончить перерыв?',
      'Покупок больше не будет. Дальше играем, и когда останется девять человек, ' +
      'финальный стол соберётся сам.']
  };
  const t = texts[stage];
  if (!t) return;
  if (!await confirmDo(t[0], t[1], 'Да, перейти')) { toast('Отменено'); return; }
  const res = await post('/stage', { stage });
  toast(res.message || 'Готово');
  refresh(true);
}

/* ---------- афиша ---------- */
async function newTournament(data){
  const base = (STATE && STATE.tournament) || {};
  const posters = (data && data.posters) || [];

  // Сначала формат: он задаёт и название, и карточку, и условия турнира
  const pick = await menu('Формат турнира',
    'С него начинаем: формат даёт название, карточку на афише и условия игры.',
    posters.map(x => ({ id: 'th:' + x.id,
      label: x.name + (x.hint ? ' · ' + x.hint : ''),
      cls: x.id === 'rebuy' ? 'up-btn--gold mi' : 'mi' })));
  if (!pick) return;
  const f = posters.find(x => x.id === pick.slice(3)) || {};

  const title = await ask('Название турнира',
    'По умолчанию — название формата. Можно своё, например «Кубок октября».',
    f.name && f.id ? f.name : (base.title || 'Турнир клуба'));
  if (!title) return;
  const date = await ask('Дата турнира', 'Выберите день.', today(), 'date');
  if (!date) return;
  const time = await ask('Время начала', 'Во сколько собираемся.', base.time || '19:00', 'time');
  if (!time) return;

  const r = await post('/new-tournament', { title, date, time, theme: f.id || '' });
  toast(r.message || 'Готово');
  refresh(true);
}
function today(){
  const d = new Date(), z = n => String(n).padStart(2,'0');
  return d.getFullYear() + '-' + z(d.getMonth()+1) + '-' + z(d.getDate());
}

async function afishaMenu(){
  let data;
  try { data = await get('/afisha'); }
  catch(e){ toast('Нет связи с сервером'); return; }
  const short = d => String(d||'').replace(/^(\S+)\s+(\S+)$/, (m,a,b) => a + ' ' + b.slice(0,3));
  const items = (data.items || []).map(t => ({
    id: 't' + t.id,
    label: (t.id === data.current ? '● ' : '') + short(t.date) + ', ' + t.time + ' — ' +
           t.title + ' · ' + t.taken + '/' + t.seats + (t.status === 'live' ? ' · идёт' : ''),
    cls: 'mi' + (t.id === data.current ? ' up-btn--gold' : '')
  }));
  const shown = (data.items || []).map(t => t.id);
  (data.past || []).filter(t => shown.indexOf(t.id) < 0).forEach(t => items.push({
    id: 't' + t.id,
    label: '✓ ' + short(t.date) + ' — ' + t.title + ' · игроков ' + t.players +
           (t.test ? ' · ТЕСТОВЫЙ' : ''),
    cls: 'mi'
  }));
  items.push({ id:'new', label:'+ Добавить турнир', cls:'mi' });
  if (data.pinned) items.push({ id:'auto', label:'Пусть касса выбирает сама', cls:'mi' });
  const act = await menu('Афиша клуба',
    data.pinned ? 'Турнир выбран вручную. ● — тот, с которым работает касса.'
                : 'Касса сама держит ближайший турнир. Можно выбрать другой.', items);
  if (!act) return;
  if (act === 'new') { await newTournament(data); return; }
  if (act === 'auto') { const r = await post('/pin', {}); toast(r.message||'Готово'); refresh(true); return; }
  const t_id = +act.slice(1);
  const t = (data.items || []).find(x => x.id === t_id);
  const done = (data.past || []).find(x => x.id === t_id);
  const acts = [{ id:'pin', label:'Работать с этим турниром', cls:'up-btn--gold mi' }];
  if (!done) acts.push({ id:'edit', label:'Настроить карточку', cls:'mi' });
  if (done) acts.push(done.test
    ? { id:'count', label:'Вернуть в зачёт рейтинга', cls:'mi' }
    : { id:'test',  label:'Тестовый — снять очки рейтинга', cls:'mi' });
  acts.push({ id:'del', label:'Убрать из афиши', cls:'mi danger' });
  const what = await menu((t || done || {}).title || 'Турнир',
    t ? t.weekday + ', ' + t.date + ' · ' + t.time + ' · записано ' + t.taken
      : (done ? done.date + ' · сыграли ' + done.players +
                (done.test ? ' · сейчас не идёт в рейтинг' : '') : ''), acts);
  if (what === 'edit'){ await editCard(t_id); return; }
  if (what === 'test'){
    if (!await confirmDo('Сделать турнир тестовым?',
      'Очки сезона за него снимутся у всех, турнир пропадёт из истории в профилях ' +
      'и из рейтинга.\n\nДеньги и список игроков останутся на месте. ' +
      'Решение можно отменить — турнир вернётся в зачёт.',
      'Снять с зачёта')) { toast('Отменено'); return; }
    const r = await post('/tournament-test', { tid: t_id, on: true });
    toast(r.message || 'Готово'); refresh(true); return;
  }
  if (what === 'count'){
    const r = await post('/tournament-test', { tid: t_id, on: false });
    toast(r.message || 'Готово'); refresh(true); return;
  }
  if (what === 'pin'){ const r = await post('/pin', { tid: t_id }); toast(r.message||'Готово'); refresh(true); }
  if (what === 'del'){
    if (!await confirmDo('Убрать турнир из афиши?',
      'Он исчезнет из приложения вместе со списком записавшихся.', 'Убрать')) { toast('Отменено'); return; }
    const r = await post('/delete-tournament', { tid: t_id });
    toast(r.message || 'Готово'); refresh(true);
  }
}

/* ---------- фишки за нокауты ----------
   В клубе выбившему дают фишку. Кто кого выбил, система не отслеживает —
   в конце вечера кассир считает фишки и вписывает число.                   */
async function chipsSheet(){
  for (;;) {
    const list = (STATE.players || []).filter(p => !p.house);
    if (!list.length) { toast('В турнире пока никого'); return; }
    const per = STATE.chip_points || 10;
    const total = list.reduce((a, p) => a + (p.chips || 0), 0);

    const act = await menu('Фишки за нокауты',
      'Одна фишка — ' + per + ' очков сезона. Всего роздано: ' + total + '. ' +
      'Нажмите игрока и впишите, сколько фишек он принёс.',
      list.map(p => ({
        id: 'c:' + p.id,
        label: p.name + ' · ' + (p.chips ? p.chips + ' ' + word(p.chips, 'фишка', 'фишки', 'фишек') +
                                           ' · ' + p.chips * per + ' очков'
                                        : 'нет фишек'),
        cls: p.chips ? 'up-btn--gold mi' : 'mi'
      })));
    if (!act) { refresh(true); return; }
    const p = list.find(x => x.id === +act.slice(2));
    if (!p) continue;
    const v = await ask('Фишки · ' + p.name,
      'Сколько фишек за нокауты он сдал. Одна фишка — ' + per + ' очков.',
      String(p.chips || 0), 'number');
    if (v === null) continue;
    const r = await post('/chips', { player_id: p.id, n: +v });
    toast(r.message || 'Готово');
    await refresh(true);
  }
}

/* ---------- настройки афиши ----------
   Расписание клуба: какие дни играем, во сколько, как называется и какая
   картинка. Турниры на эти дни создаются сами, на несколько недель вперёд.  */
const DAY_FULL = { 'пн':'Понедельник', 'вт':'Вторник', 'ср':'Среда', 'чт':'Четверг',
                   'пт':'Пятница', 'сб':'Суббота', 'вс':'Воскресенье' };

async function schedSheet(){
  for (;;) {
    let d;
    try { d = await get('/schedule'); }
    catch (e) { toast('Нет связи с сервером'); return; }

    const on = (d.days || []).filter(x => x.on);
    const items = [
      { id:'power', label: d.on ? 'Расписание включено — выключить' : 'Расписание выключено — включить',
        cls: d.on ? 'mi' : 'up-btn--gold mi' },
      { id:'weeks', label:'На сколько недель вперёд · ' + d.weeks, cls:'mi' }
    ];
    (d.days || []).forEach(x => items.push({
      id: 'd:' + x.day,
      label: DAY_FULL[x.day] + ' · ' + (x.on ? x.time + ' · ' + x.title : 'не играем'),
      cls: x.on ? 'mi' : 'mi off'
    }));

    const act = await menu('Настройки афиши',
      on.length ? 'Играем ' + on.length + ' ' + word(on.length, 'день', 'дня', 'дней') +
                  ' в неделю. Нажмите день, чтобы настроить.'
                : 'Пока не выбран ни один день.', items);
    if (!act) { refresh(true); return; }

    if (act === 'power') {
      const r = await post('/schedule', { on: !d.on });
      toast(r.message || 'Готово'); continue;
    }
    if (act === 'weeks') {
      const v = await ask('На сколько недель вперёд',
        'Столько недель афиши будет видно игрокам. Обычно две.', String(d.weeks), 'number');
      if (v === null) continue;
      const r = await post('/schedule', { weeks: +v });
      toast(r.message || 'Готово'); continue;
    }
    if (act.indexOf('d:') === 0) {
      await schedDay(act.slice(2), d);
    }
  }
}

async function schedDay(wd, d){
  for (;;) {
    const day = (d.days || []).find(x => x.day === wd);
    if (!day) return;
    const pName = posterName(day.theme, d.posters);
    const act = await menu(DAY_FULL[wd],
      day.on ? 'Играем в этот день.' : 'В этот день турнира нет.',
      day.on ? [
        { id:'off',   label:'Не играем в этот день', cls:'mi danger' },
        { id:'time',  label:'Время · ' + day.time, cls:'mi' },
        { id:'title', label:'Название · ' + day.title, cls:'mi' },
        { id:'skin',  label:'Формат · ' + pName, cls:'mi' }
      ] : [
        { id:'on', label:'Играем в этот день', cls:'up-btn--gold mi' }
      ]);
    if (!act) return;

    if (act === 'on' || act === 'off') day.on = (act === 'on');
    if (act === 'time') {
      const v = await ask('Время начала в ' + DAY_FULL[wd].toLowerCase(),
        'В виде 19:00.', day.time);
      if (v === null) continue;
      day.time = v;
    }
    if (act === 'title') {
      const v = await ask('Название турнира',
        'Так он будет называться на афише каждую неделю.', day.title);
      if (v === null) continue;
      day.title = v;
    }
    if (act === 'skin') {
      const now = String(day.theme || '');
      const pick = await menu('Формат по ' + DAY_FULL[wd].toLowerCase() + 'ам',
        'Сейчас: ' + pName + '. Выбор формата заодно переименует турниры этого дня.',
        (d.posters || []).map(x => ({ id: 'th:' + x.id,
          label: x.name + (x.hint ? ' · ' + x.hint : '') + (x.id === now ? '  ·  сейчас' : ''),
          cls: x.id === now ? 'up-btn--gold mi' : 'mi' })));
      if (!pick) continue;
      const f = (d.posters || []).find(x => x.id === pick.slice(3)) || {};
      day.theme = f.id;
      if (f.id) day.title = f.name;
    }

    const r = await post('/schedule', { days: d.days });
    toast(r.message || 'Готово');
    if (r.schedule) d = Object.assign(d, r.schedule);
    if (act === 'on' || act === 'off') return;
  }
}

/* ---------- карточка турнира ----------
   Всё, что видно игроку на афише: название, подпись, текст о мероприятии,
   картинка, время, цена и число мест. После каждой правки список открывается
   заново с новыми значениями — видно, что получилось.                       */
function posterName(theme, posters){
  const id = String(theme || '').replace('up-poster--', '');
  return ((posters || []).find(x => x.id === id) || {}).name || 'Золотая';
}

async function editCard(t_id){
  for (;;) {
    let data;
    try { data = await get('/afisha'); }
    catch (e) { toast('Нет связи с сервером'); return; }
    const t = (data.items || []).find(x => x.id === t_id);
    if (!t) { toast('Турнир не найден'); return; }
    const posters = data.posters || [];

    const act = await menu('Карточка турнира',
      t.weekday + ', ' + t.date + ' · ' + t.time + ' · записано ' + t.taken, [
        { id:'title', label:'Название · ' + t.title, cls:'mi' },
        { id:'meta',  label:'Подпись · ' + (t.meta || 'нет'), cls:'mi' },
        { id:'about', label:'О мероприятии · ' + (t.about ? 'есть текст' : 'нет'), cls:'mi' },
        { id:'skin',  label:'Формат · ' + posterName(t.theme, posters), cls:'mi' },
        { id:'time',  label:'Время · ' + t.time, cls:'mi' },
        { id:'buyin', label:'Вход · ' + fmt(t.buyin) + ' ₽', cls:'mi' },
        { id:'seats', label:'Мест · ' + t.seats, cls:'mi' }
      ]);
    if (!act) { refresh(true); return; }

    let body = null;

    if (act === 'title') {
      const v = await ask('Название турнира',
        'Крупная надпись на карточке. Коротко — длинное название мельчает.', t.title);
      if (v === null) continue;
      body = { title: v };
    }
    if (act === 'meta') {
      const v = await ask('Подпись под названием',
        'Строчка мелким шрифтом внизу карточки — коротко, в одну строку. ' +
        'Например: Hold\'em · 4 стола · вход 1500 ₽',
        t.meta || '');
      if (v === null) continue;
      body = { meta: v };
    }
    if (act === 'about') {
      const v = await ask('О мероприятии',
        'Текст, который игрок увидит, открыв турнир в приложении. Он же уходит ' +
        'в рассылку. Пустое поле — текста не будет.', t.about || '', 'area');
      if (v === null) continue;
      body = { about: v };
    }
    if (act === 'skin') {
      const now = String(t.theme || '').replace('up-poster--', '');
      const pick = await menu('Формат турнира',
        'Сейчас: ' + posterName(t.theme, posters) + '. У каждого формата своя карточка.',
        posters.map(x => ({ id: 'th:' + x.id,
                            label: x.name + (x.hint ? ' · ' + x.hint : '') +
                                   (x.id === now ? '  ·  сейчас' : ''),
                            cls: x.id === now ? 'up-btn--gold mi' : 'mi' })));
      if (!pick) continue;
      const f = posters.find(x => x.id === pick.slice(3)) || {};
      const body = { tid: t_id, theme: f.id };
      if (f.id && f.name !== t.title) {
        const rename = await menu('Назвать турнир «' + f.name + '»?',
          'Сейчас он называется «' + t.title + '».', [
            { id:'yes', label:'Да, назвать «' + f.name + '»', cls:'up-btn--gold mi' },
            { id:'no',  label:'Оставить название как есть', cls:'mi' }
          ]);
        if (!rename) continue;
        if (rename === 'yes') body.title = f.name;
      }
      const r = await post('/tournament-theme', body);
      toast(r.message || 'Готово');
      continue;
    }
    if (act === 'time') {
      const v = await ask('Время начала', 'В виде 19:00. Дата остаётся прежней.', t.time);
      if (v === null) continue;
      body = { time: v };
    }
    if (act === 'buyin') {
      const v = await ask('Вход, рублей', 'Только для этого турнира.', String(t.buyin), 'number');
      if (v === null) continue;
      body = { buyin: +v };
    }
    if (act === 'seats') {
      const v = await ask('Сколько мест', 'Столы × места за столом.', String(t.seats), 'number');
      if (v === null) continue;
      body = { seats: +v };
    }

    if (body) {
      body.tid = t_id;
      const r = await post('/tournament-edit', body);
      toast(r.message || 'Готово');
    }
  }
}

/* ---------- рассылка в бот ----------
   Сначала показываем кассиру ровно тот текст, который уйдёт людям, и сколько
   их. Отправка — только после подтверждения.                                */
async function mailSheet(){
  const pre = await post('/broadcast', { preview: true });
  if (!pre.ok) { toast(pre.message || 'Не получилось'); return; }

  const kind = await menu('Рассылка в бот',
    'Получат ' + (pre.total - pre.off) + ' из ' + pre.total +
    ' участников клуба' + (pre.off ? ' (' + pre.off + ' отписались)' : '') + '.', [
      { id:'afisha', label:'Афиша ближайшего турнира', cls:'up-btn--gold mi' },
      { id:'own',    label:'Своё сообщение', cls:'mi' }
    ]);
  if (!kind) return;

  let text = pre.text;
  if (kind === 'own') {
    text = await ask('Своё сообщение',
      'Напишите текст — он уйдёт всем участникам клуба как есть. ' +
      'Внизу сообщения будут кнопки записи на турнир.', '');
    if (!text || text.trim().length < 3) { toast('Отменено'); return; }
  }

  const ok = await confirmDo('Отправить всем?',
    text.replace(/<[^>]+>/g, '') + '\n\n— — —\nПолучат: ' + (pre.total - pre.off) +
    ' человек. Отменить отправку будет нельзя.',
    'Отправить');
  if (!ok) { toast('Отменено'); return; }

  const r = await post('/broadcast', kind === 'own' ? { text: text } : {});
  toast(r.message || 'Отправляю');
}

/* ---------- игроки клуба ----------
   То, ради чего обычно лезут в базу: кто вообще есть в клубе, с какого числа,
   с Telegram или без, подписаны ли документы.                                */
async function peopleSheet(){
  let d;
  try { d = await get('/people'); }
  catch (e) { toast('Нет связи с сервером'); return; }
  const list = d.players || [];
  const html =
    '<div class="help" style="margin-bottom:10px"><p>В клубе <b>' + d.total +
    '</b> ' + word(d.total, 'игрок', 'игрока', 'игроков') +
    (d.groups ? '. Похожих профилей: <b>' + d.groups + '</b> — смотрите «Двойные профили».' : '') +
    '</p></div>' +
    list.map(p =>
      '<button class="prow" data-person="' + p.id + '">' +
        '<b>№' + p.number + ' · ' + esc(p.name) + '</b>' +
        '<small>' + (p.telegram ? 'приложение' : '<span class="no">без Telegram</span>') +
        (p.phone ? ' · ' + esc(p.phone) : '') +
        ' · турниров ' + p.games +
        (p.docs ? ' · документы ✓' : ' · <span class="no">без документов</span>') +
        (p.created ? ' · с ' + esc(p.created) : '') +
        '</small></button>').join('');
  show('Игроки клуба', html);
  document.querySelectorAll('[data-person]').forEach(b => {
    b.onclick = () => personCard(list.find(x => x.id === +b.dataset.person));
  });
}

async function personCard(p){
  if (!p) return;
  const items = [
    { id:'idok', label: p.id_ok ? 'Снять отметку о документе' : 'Документ проверен, 18+', cls:'mi' },
    { id:'dupes', label:'Двойные профили', cls:'mi' },
    { id:'del', label:'Удалить профиль', cls:'mi danger' }
  ];
  const act = await menu('№' + p.number + ' · ' + p.name,
    (p.telegram ? 'Зарегистрирован в приложении' : 'Заведён кассиром, без Telegram') +
    (p.phone ? ' · ' + p.phone : '') +
    (p.fio ? ' · ' + p.fio : '') +
    ' · турниров ' + p.games + ' · оплат ' + p.pays +
    (p.money ? ' на ' + fmt(p.money) + ' ₽' : '') +
    (p.id_ok ? ' · документ проверен ' + p.id_ok : ''), items);

  if (act === 'idok'){
    const r = await post('/id-check', { player_id: p.id });
    toast(r.message || 'Готово'); refresh(true); return;
  }
  if (act === 'dupes'){ await dupesMenu(); return; }
  if (act === 'del'){
    const ok = await confirmDo('Удалить профиль?',
      '№' + p.number + ' · ' + p.name + '\n\n' +
      'Человек исчезнет из клуба и при следующем входе в приложение будет ' +
      'регистрироваться заново, с новым номером. Записи на турниры и подписанные ' +
      'документы пропадут.\n\n' +
      'Если это просто второй профиль того же человека — закройте это окно и ' +
      'объедините профили, тогда ничего не потеряется.',
      'Удалить');
    if (!ok) { toast('Отменено'); return; }
    let r = await post('/delete-player', { player_id: p.id });
    if (!r.ok && r.has_money) {
      const twice = await confirmDo('Удалить вместе с оплатами?',
        r.message + '\n\nЭти оплаты исчезнут из кассы, и выручка того турнира ' +
        'уменьшится. Делайте так только если турнир тестовый.',
        'Да, удалить всё');
      if (!twice) { toast('Отменено'); return; }
      r = await post('/delete-player', { player_id: p.id, force: true });
    }
    toast(r.message || 'Готово');
    if (r.ok) { refresh(true); peopleSheet(); }
  }
}

/* ---------- двойные профили ----------
   Один человек записался дважды: завёл профиль в приложении, а до этого его
   добавил кассир кнопкой «+ Игрок». Склеиваем вручную — автоматика может
   склеить двух разных Александров.                                          */
async function dupesMenu(){
  let d;
  try { d = await get('/dupes'); }
  catch (e) { toast('Нет связи с сервером'); return; }
  const groups = d.groups || [];
  if (!groups.length) {
    show('Двойные профили',
      '<div class="help"><p>Совпадений нет: в клубе ' + d.total +
      ' профилей, и ни у кого не повторяются имя или телефон.</p></div>');
    return;
  }
  const pick = await menu('Двойные профили',
    'Нашлось совпадений: ' + groups.length + '. Проверьте, точно ли это один человек.',
    groups.map((g, i) => ({
      id: String(i),
      label: g.players.map(p => '№' + p.number + ' ' + p.name).join('  ·  ') +
             '  (' + g.why + ')',
      cls: 'mi'
    })));
  if (pick === null || pick === undefined || pick === '') return;
  const g = groups[+pick];
  if (!g) return;

  const keep = g.players[0];
  const rest = g.players.slice(1);
  const lines = g.players.map(p =>
    '№' + p.number + ' · ' + p.name + ' · ' + (p.tg_id ? 'из приложения' : 'завёл кассир') +
    ' · турниров ' + p.games + (p.phone ? ' · ' + p.phone : '')).join('\n');
  const ok = await confirmDo('Это один человек?',
    lines + '\n\nВсё переедет в профиль №' + keep.number + ' · ' + keep.name +
    ': турниры, оплаты, подписанные документы. Остальные профили исчезнут.\n\n' +
    'Если это разные люди — закройте окно, ничего не произойдёт.',
    'Да, это один человек');
  if (!ok) { toast('Отменено'); return; }
  for (const p of rest) {
    const r = await post('/merge', { keep_id: keep.id, drop_id: p.id });
    if (!r.ok) { toast(r.message || 'Не получилось'); return; }
  }
  toast('Объединено в профиль №' + keep.number);
  refresh(true);
}

/* ---------- нижние кнопки ---------- */
$('btnAdd').onclick = async () => { await addPlayer(''); };

// Ник в клубе один на человека. Совпал — спрашиваем, тот ли это человек:
// молча брать чужой профиль нельзя, туда уедут чужие деньги и история.
async function addPlayer(start){
  const name = await ask('Новый игрок',
    'Ник, под которым объявлять за столом. Игрок сразу попадёт в список турнира. ' +
    'Такой профиль не привязан к Telegram — лучше, если человек зарегистрируется в боте сам.',
    start || '');
  if (!name) return;
  const res = await post('/add-player', { name });

  if (res.exists) {
    const e = res.exists;
    const act = await menu('Такой ник уже есть',
      '№' + e.number + ' · ' + e.name + ' · ' +
      (e.telegram ? 'зарегистрирован в приложении' : 'завёл кассир') +
      ' · турниров ' + e.games, [
        { id:'same', label:'Это он — добавить в турнир', cls:'up-btn--gold mi' },
        { id:'other', label:'Нет, это другой человек', cls:'mi' }
      ]);
    if (act === 'same') {
      const r = await post('/add-player', { use_id: e.id });
      toast(r.message || 'Добавлен'); refresh(true); return;
    }
    if (act === 'other') {
      toast('Добавьте к нику отличие — букву фамилии');
      await addPlayer(name + ' ');
    }
    return;
  }

  toast(res.message || 'Добавлен');
  refresh(true);
}

$('btnMore').onclick = async () => {
  const t = (STATE && STATE.tournament) || {};
  // «Фишки за нокауты» показываем только там, где формат их считает
  const extra = t.ko ? [{ id:'chips', label:'Фишки за нокауты', cls:'up-btn--gold mi' }] : [];
  const act = await menu('Ещё',
    t.title ? t.title + ' · ' + (t.date || '') + ' ' + (t.time || '') : 'Сервер не отвечает',
    extra.concat([
      { id:'help',   label:'Справка по кассе', cls:'up-btn--gold mi' },
      { id:'afisha', label:'Афиша клуба', cls:'mi' },
      { id:'seatm',  label:'Режим рассадки', cls:'mi' },
      { id:'sched',  label:'Настройки афиши', cls:'mi' },
      { id:'mail',   label:'Рассылка в бот', cls:'mi' },
      { id:'people', label:'Игроки клуба', cls:'mi' },
      { id:'dupes',  label:'Двойные профили', cls:'mi' },
      { id:'backup', label:'Сделать копию базы', cls:'mi' },
      { id:'key',    label:'Ключ доступа', cls:'mi' },
      { id:'finish', label:'Завершить турнир', cls:'mi danger' }
    ]));
  if (act === 'help') { helpSheet(); return; }
  if (act === 'chips') { await chipsSheet(); return; }
  if (act === 'sched') { await schedSheet(); return; }
  if (act === 'mail') { await mailSheet(); return; }
  if (act === 'people') { await peopleSheet(); return; }
  if (act === 'dupes') { await dupesMenu(); return; }
  if (act === 'backup'){
    const r = await post('/backup', {});
    toast(r.message || 'Готово'); return;
  }
  if (act === 'afisha') { await afishaMenu(); return; }
  if (act === 'seatm'){
    const auto = !(STATE && STATE.seatmap && STATE.seatmap.auto === false);
    const pick = await menu('Режим рассадки',
      auto ? 'Сейчас: касса сажает пришедших сама.' : 'Сейчас: сажаете вручную.', [
        { id:'auto',   label:'Касса сажает сама', cls: auto ? 'up-btn--gold mi' : 'mi' },
        { id:'manual', label:'Сажаю вручную', cls: auto ? 'mi' : 'up-btn--gold mi' }
      ]);
    if (!pick) return;
    const r = await post('/seat-mode', { mode: pick });
    toast(r.message || 'Готово'); refresh(true); return;
  }
  if (act === 'key'){
    const v = await ask('Ключ доступа', 'Тот же ключ, что в config.json на сервере.', KEY);
    if (v === null) return;
    KEY = v; try { localStorage.setItem('up_admin_key', KEY); } catch(e) {}
    refresh(); return;
  }
  if (act === 'finish'){
    if (!await confirmDo('Завершить турнир?',
      'Последнему игроку присвоится первое место, всем начислятся очки сезона. ' +
      'Отменить будет нельзя. Если турнир ещё идёт — закройте это окно.',
      'Завершить')) { toast('Отменено'); return; }
    const res = await post('/finish', {});
    toast(res.message || 'Готово');
    refresh(true);
  }
};

/* ---------- старт ---------- */
(async function(){
  if (!KEY) {
    const v = await ask('Ключ доступа', 'Введите ключ из config.json, чтобы открыть кассу.', '');
    if (v) { KEY = v; try { localStorage.setItem('up_admin_key', KEY); } catch(e) {} }
  }
  refresh();
  setInterval(() => refresh(true), 5000);
})();
</script>
